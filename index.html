<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agent Ariane-Ithélice v1.1 — Libre & Gratuit</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a22; --panel2:#1d2230;
    --text:#e8ecf1; --muted:#9aa3b2; --accent:#7cc4ff;
    --user:#243047; --bot:#1b2230; --border:#2a3142;
    --danger:#ff6b6b; --ok:#6bd39a; --sidebar-w:320px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
  
  /* Sidebar */
  .sidebar{
    width:var(--sidebar-w);background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;transition:margin-left .3s ease;
    flex-shrink:0;
  }
  .sidebar.closed{margin-left:calc(-1 * var(--sidebar-w))}
  .sidebar-header{
    padding:12px;border-bottom:1px solid var(--border);display:flex;
    justify-content:space-between;align-items:center;
  }
  .sidebar-header h2{margin:0;font-size:15px;color:var(--accent)}
  .tabs{display:flex;border-bottom:1px solid var(--border)}
  .tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-size:13px;
       color:var(--muted);border-bottom:2px solid transparent;transition:.2s}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab-content{flex:1;overflow-y:auto;padding:10px;display:none}
  .tab-content.active{display:block}
  
  .conv-item,.mem-item{
    background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:10px;margin-bottom:8px;font-size:13px;cursor:pointer;
    transition:.2s;position:relative;
  }
  .conv-item:hover,.mem-item:hover{border-color:var(--accent)}
  .conv-item.active{border-color:var(--accent);background:#1f2a40}
  .conv-item .title{font-weight:600;margin-bottom:4px;white-space:nowrap;
                    overflow:hidden;text-overflow:ellipsis;padding-right:60px}
  .conv-item .date{font-size:11px;color:var(--muted)}
  .conv-item .actions,.mem-item .actions{
    position:absolute;top:8px;right:8px;display:flex;gap:4px;
  }
  .icon-btn{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    width:24px;height:24px;border-radius:4px;cursor:pointer;font-size:12px;
    display:inline-flex;align-items:center;justify-content:center;transition:.2s;
  }
  .icon-btn:hover{color:var(--accent);border-color:var(--accent)}
  .icon-btn.danger:hover{color:var(--danger);border-color:var(--danger)}
  
  .mem-item{cursor:default}
  .mem-item .content{padding-right:30px;line-height:1.4}
  .mem-item .badge{
    display:inline-block;font-size:10px;padding:2px 6px;border-radius:10px;
    margin-bottom:4px;background:var(--border);color:var(--muted);
  }
  .mem-item .badge.auto{background:#2a3f5a;color:var(--accent)}
  
  .new-btn{
    width:100%;padding:8px;background:var(--accent);color:#0a1020;border:none;
    border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;margin-bottom:10px;
  }
  .new-btn:hover{opacity:.9}
  
  .mem-input{display:flex;gap:6px;margin-bottom:10px}
  .mem-input input{
    flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:8px;font-size:13px;font-family:inherit;
  }
  .mem-input button{
    background:var(--accent);color:#0a1020;border:none;border-radius:6px;
    padding:0 12px;cursor:pointer;font-weight:600;font-size:13px;
  }
  
  /* Main area */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{
    padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
