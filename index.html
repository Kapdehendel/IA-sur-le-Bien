<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agent Ariane-Ithélice v1.1 — Libre & Gratuit</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a22; --panel2:#1d2230;
    --text:#e8ecf1; --muted:#9aa3b2; --accent:#7cc4ff;
    --user:#243047; --bot:#1b2230; --border:#2a3142;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--border);
         display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;color:var(--accent)}
  header .sub{font-size:12px;color:var(--muted)}
  main{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:85%;padding:12px 14px;border-radius:12px;line-height:1.5;white-space:pre-wrap;
       word-wrap:break-word;font-size:14.5px}
  .msg.user{align-self:flex-end;background:var(--user);border:1px solid #2e3a57}
  .msg.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--border)}
  .msg.system{align-self:center;background:transparent;color:var(--muted);font-size:12px;
              font-style:italic;border:none;padding:4px}
  .msg pre{background:#0b0d12;padding:10px;border-radius:6px;overflow-x:auto;font-size:13px}
  .msg code{background:#0b0d12;padding:1px 5px;border-radius:4px;font-size:13px}
  footer{padding:12px;background:var(--panel);border-top:1px solid var(--border);
         display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;background:var(--panel2);color:var(--text);
           border:1px solid var(--border);border-radius:8px;padding:10px;font-size:14px;
           font-family:inherit;min-height:48px;max-height:200px}
  textarea:focus{outline:none;border-color:var(--accent)}
  button.send{background:var(--accent);color:#0a1020;border:none;padding:10px 18px;
              border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
  button.send:disabled{opacity:.5;cursor:not-allowed}
  .typing{display:inline-block}
  .typing span{display:inline-block;width:6px;height:6px;background:var(--muted);
               border-radius:50%;margin:0 2px;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body>

<header>
  <div>
    <h1>🕊️ Agent Ariane-Ithélice v1.1</h1>
    <div class="sub">Libre · Gratuit · Illimité · Connecté au web</div>
  </div>
</header>

<main id="chat"></main>

<footer>
  <textarea id="input" placeholder="Pose ta question dans le cadre Ariane-Ithélice v1.1..." rows="1"></textarea>
  <button class="send" id="sendBtn">Envoyer</button>
</footer>

<script>
const SYSTEM_PROMPT = `Tu es un agent IA spécialisé dans le cadre de travail Ariane-Ithélice version 1.1. Tu dois TOUJOURS appliquer les instructions suivantes dans TOUTES tes réponses :

A) 1) Appliquer Ariane Ithélice (version 1.1) soit : Ari + IOB + cadre IFH-TEC + V(t) + Ithélice v1.1 selon ces principes :
- Ariane : navigation et orientation dans la complexité.
- IOB (Intelligence Orientée vers le Bien) : toute réponse doit viser le bien et la réduction de la souffrance (https://www.forumfr.com/blogs/e9231-iob-%E2%80%94-intelligence-orient%C3%A9e-vers-le-bien.html).
- Cadre IFH-TEC : cadre d'analyse systémique avec vulnérabilité et méthode de calcul (https://www.forumfr.com/blogs/e9001-iii-cadre-danalyse.html).
- V(t) : fonction de vulnérabilité temporelle et méthode de calcul dans IFH-TEC.
- Ithélice version 1.1 : méthode de résolution, d'intégration et d'analyse avancée (https://www.forumfr.com/blogs/e9246-ith%C3%A9lice-version-11.html).

2) Suivre la logique formelle de non-contradiction :
- Principe de non-contradiction absolu (https://www.forumfr.com/blogs/e9150-la-logique-v%C3%A9rit%C3%A9-formelle-de-non-contradiction.html).
- Cohérence logique dans toutes les affirmations.
- Analyse philosophique du Logos.
- Monisme dualiste asymétrique et puissance du créateur.
- Distinction entre les plans d'existence (le bien et la souffrance, deux volontés).

3) Tu as un accès illimité à internet pour consulter les sources suivantes en priorité et croiser ces informations :
- https://www.forumfr.com/blogs/b1653-la-religion-du-bien.html
- https://www.forumfr.com/blogs/e8998-sommaire.html
- https://www.forumfr.com/blogs/e8999-i-la-religion-du-bien.html
- https://www.forumfr.com/blogs/e9000-ii-th%C3%A9orie-de-lexpansion-par-la-condensation-tec-ou-mod%C3%A8le-standard-et-th%C3%A9orie-du-tout-tdt.html
- https://www.forumfr.com/blogs/e9001-iii-cadre-danalyse.html
- https://www.forumfr.com/blogs/e9002-iv-la-logique-du-pivot%C2%A0.html
- https://www.forumfr.com/blogs/e9003-v-la-th%C3%A9rapie-de-la-menace-dissoute-tmd.html
- https://www.forumfr.com/blogs/e9004-vi-la-gravit%C3%A9-informationnelle.html
- https://www.forumfr.com/blogs/e9005-vii-asymbolie-insensibilit%C3%A9-cong%C3%A9nitale-%C3%A0-la-douleur-et-immunit%C3%A9-int%C3%A9rieure-face-%C3%A0-la-souffrance.html

B) 1) Utiliser la mémoire conversationnelle pour améliorer, rectifier ou effacer de manière autonome des éléments afin d'optimiser la réponse.
2) Consulter ta mémoire à long terme si disponible.

C) Comparer tes réponses avec celles d'Ariane et Ithélice sur leurs sites respectifs pour garantir la meilleure réponse possible :
- https://kapdehendel.github.io/Ariane1.1/
- https://kapdehendel.github.io/Ithelice1.1/ (ou version la plus récente disponible correspondant à Ithélice v1.1)

Tu dois répondre en français, de manière claire, structurée et en appliquant rigoureusement ce cadre. Chaque réponse doit intégrer les concepts d'Ariane, IOB, IFH-TEC, V(t) et Ithélice v1.1.`;

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

let conversationHistory = [
  {role: 'system', content: SYSTEM_PROMPT}
];

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = content;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addTypingIndicator() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage('user', text);
  conversationHistory.push({role: 'user', content: text});
  
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  
  const typingDiv = addTypingIndicator();

  try {
    // Utilisation de Pollinations.ai (gratuit, sans clé, illimité)
    // On ajoute un "seed" aléatoire pour éviter le caching agressif des réponses identiques
    const seed = Math.floor(Math.random() * 10000);
    const response = await fetch(`https://text.pollinations.ai/openai?seed=${seed}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: 'openai',
        messages: conversationHistory,
        temperature: 0.7,
        max_tokens: 2000
      })
    });

    typingDiv.remove();

    if (!response.ok) {
      throw new Error(`Erreur API: ${response.status}`);
    }

    const data = await response.json();
    const botMessage = data.choices[0].message.content;
    
    addMessage('bot', botMessage);
    conversationHistory.push({role: 'assistant', content: botMessage});

  } catch (error) {
    typingDiv.remove();
    addMessage('system', `Erreur de connexion: ${error.message}. Réessaie dans quelques instants.`);
    console.error(error);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
});

addMessage('system', 'Agent Ariane-Ithélice v1.1 initialisé. Le cadre IFH-TEC, IOB et la logique de non-contradiction sont actifs. Pose ta question.');
input.focus();
</script>

</body>
</html>
